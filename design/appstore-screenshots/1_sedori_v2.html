<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:2688px;overflow:hidden}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;color:#0B2350;
 background:radial-gradient(1200px 900px at 85% 8%, #DCE8FB 0%, rgba(220,232,251,0) 70%),linear-gradient(180deg,#F7F9FD 0%,#EAF1FB 55%,#DCE7F8 100%);position:relative}
.wrap{position:absolute;top:140px;left:0;right:0;text-align:center}
.pill{display:inline-flex;align-items:center;gap:14px;padding:16px 38px;border-radius:999px;background:#F28C1B;color:#fff;font-weight:800;font-size:46px;letter-spacing:.06em;box-shadow:0 10px 24px rgba(242,140,27,.28)}
.pill i{width:14px;height:14px;border-radius:50%;background:#fff;display:inline-block}
h1{margin-top:58px;font-weight:900;font-size:108px;line-height:1.22;letter-spacing:.01em}
h1 em{font-style:normal;color:#1F5FD6}
p{margin-top:40px;font-weight:600;font-size:52px;color:#4A5D80;letter-spacing:.04em}
.phone{position:absolute;left:50%;top:790px;width:960px;transform:translateX(-50%);filter:drop-shadow(0 40px 60px rgba(11,35,80,.28))}
</style></head><body>
<div class="wrap">
 <span class="pill">せどりの仕入れリサーチ</span>
 <h1>かざすだけで<br><em>Amazon相場</em>がわかる</h1>
 <p>価格・売れ行き・利益を1画面で</p>
</div>
<img class="phone" src="phone.png">
</body></html>
