<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:2688px;overflow:hidden}
body{background:#F2ECDF;position:relative;color:#1A1A1A;font-family:"YuMincho"}
body:before{content:"";position:absolute;inset:0;background:radial-gradient(rgba(120,90,40,.06) 1px,transparent 1.5px) 0 0/7px 7px}
.rule{position:absolute;left:70px;right:70px;top:118px;border-top:3px solid #1A1A1A;border-bottom:1px solid #1A1A1A;height:12px}
.kicker{position:absolute;left:70px;top:156px;font-family:"YuMincho";font-weight:800;font-size:44px;letter-spacing:.3em}
.vol{position:absolute;right:70px;top:162px;font:600 34px "Hiragino Sans";letter-spacing:.2em;color:#555}
.title{position:absolute;right:70px;top:300px;writing-mode:vertical-rl;font-family:"Toppan Bunkyu Midashi Mincho";font-weight:800;font-size:168px;line-height:1.25;letter-spacing:.04em}
.title em{font-style:normal;color:#B8321E}
.sub{position:absolute;right:500px;top:300px;writing-mode:vertical-rl;font-family:"YuMincho";font-weight:600;font-size:52px;letter-spacing:.14em;line-height:1.6}
.sub b{font-weight:800;border-right:6px solid #B8321E;padding-right:6px}
.seal{position:absolute;right:120px;top:1620px;width:210px;height:210px;background:#B8321E;color:#F2ECDF;transform:rotate(-6deg);border-radius:14px;display:grid;grid-template-columns:1fr 1fr;place-items:center;font-family:"Toppan Bunkyu Midashi Mincho";font-weight:800;font-size:82px;line-height:1;padding:16px;box-shadow:inset 0 0 0 7px #B8321E,inset 0 0 0 11px #F2ECDF}
.phone{position:absolute;left:36px;top:1000px;width:620px;transform:rotate(-3deg);filter:drop-shadow(14px 22px 0 rgba(60,40,10,.14))}
.cap{position:absolute;right:70px;bottom:120px;width:420px;font-family:"YuMincho";font-weight:600;font-size:38px;line-height:1.7;color:#333;border-top:2px solid #1A1A1A;padding-top:18px}
</style></head><body>
<div class="rule"></div>
<div class="kicker">せどり仕入れリサーチ</div>
<div class="vol">SELLER LENS</div>
<div class="title">仕入れは、<br><em>かざして</em>決める。</div>
<div class="sub"><b>せどり</b>の目利きを、ポケットに。</div>
<div class="seal"><span>相</span><span>場</span><span>即</span><span>決</span></div>
<img class="phone" src="../phone.png">
<div class="cap">Amazonの価格・売れ行き・出品者数を、バーコード一つで一画面に。</div>
</body></html>
