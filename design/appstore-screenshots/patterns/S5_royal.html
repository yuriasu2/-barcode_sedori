<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:2688px;overflow:hidden}
body{background:#4169E1;background-image:radial-gradient(rgba(255,255,255,.09) 2.2px,transparent 2.8px);background-size:24px 24px;position:relative;font-family:"Hiragino Sans";color:#fff}
.kicker{position:absolute;left:60px;top:150px;font:800 60px "Hiragino Sans";letter-spacing:.04em;background:#111;color:#FFD200;padding:12px 26px 16px}
.lead{position:absolute;left:70px;top:322px;font:800 66px "Hiragino Sans";letter-spacing:.02em}
.lead b{border-bottom:10px solid #FFD200}
h1{position:absolute;left:64px;top:430px;font-family:"Toppan Bunkyu Midashi Gothic";font-weight:800;line-height:1.1;letter-spacing:-.01em}
h1 .l1{display:block;font-size:146px}
h1 .l2{display:block;font-size:146px;color:#FFD200}
.burst{position:absolute;right:16px;top:8px;width:310px;height:310px;transform:rotate(12deg)}
.burst div{position:absolute;inset:0;background:#E60012}
.burst span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:"Toppan Bunkyu Midashi Gothic";font-weight:800;font-size:50px;line-height:1.1;text-align:center}
.burst span b{font-size:76px}
.band{position:absolute;left:-40px;right:-40px;top:820px;background:#111;color:#fff;transform:rotate(-3deg);padding:24px 0 28px;text-align:center;font:800 48px "Hiragino Sans";letter-spacing:.03em}
.band em{font-style:normal;color:#FFD200}
.phone{position:absolute;left:50px;top:1000px;width:520px;transform:rotate(-3deg);filter:drop-shadow(14px 20px 0 rgba(0,20,80,.35))}
.card{position:absolute;left:640px;width:560px;background:#fff;color:#111;border:7px solid #111;border-radius:22px;padding:30px 24px;text-align:center;box-shadow:12px 16px 0 rgba(0,20,80,.35)}
.card svg{width:120px;height:120px;display:block;margin:0 auto 14px}
.card h3{font-family:"Toppan Bunkyu Midashi Gothic";font-weight:800;font-size:54px;line-height:1.2;white-space:nowrap}
.card p{margin-top:12px;font:700 36px "Hiragino Sans";line-height:1.45}
.c1{top:1090px;transform:rotate(2deg)}.c1 h3{color:#1E9E46}
.c2{top:1490px;transform:rotate(-2deg)}.c2 h3{color:#1F5FD6;font-size:47px}
.note{position:absolute;left:660px;top:1925px;font-family:"Klee";font-weight:600;font-size:56px;line-height:1.25;color:#FFD200;transform:rotate(-4deg)}
.strip{position:absolute;left:60px;top:2165px;width:1122px;border-radius:30px;filter:drop-shadow(14px 18px 0 rgba(0,20,80,.35))}
svg.over{position:absolute;inset:0;width:1242px;height:2688px;pointer-events:none}
</style></head><body>
<div class="kicker">利益アラートを設定</div>
<div class="lead"><b>条件にヒット</b>した商品を</div>
<h1><span class="l1">緑枠と振動で</span><span class="l2">お知らせ</span></h1>
<div class="burst"><div id="star"></div><span>ブルッと<b>通知</b></span></div>
<div class="band"><em>粗利益・ランキング・出品者数</em>で条件を設定</div>
<img class="phone" src="../phone_alert_real.png">
<div class="card c1"><svg viewBox="0 0 120 120"><rect x="12" y="12" width="96" height="96" rx="18" fill="none" stroke="#1E9E46" stroke-width="12"/><path d="M34 62 L52 80 L88 40" fill="none" stroke="#1E9E46" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg><h3>設定条件にヒット</h3><p>緑枠でひと目で確認</p></div>
<div class="card c2"><svg viewBox="0 0 120 120"><rect x="42" y="22" width="36" height="76" rx="9" fill="none" stroke="#1F5FD6" stroke-width="10"/><path d="M28 40 Q18 60 28 80 M14 32 Q0 60 14 88 M92 40 Q102 60 92 80 M106 32 Q120 60 106 88" fill="none" stroke="#1E9E46" stroke-width="8" stroke-linecap="round"/></svg><h3>バイブレーション通知</h3><p>仕入れチャンスを見逃さない</p></div>
<div class="note">ヒットすると<br>緑枠に！</div>
<img class="strip" src="../alert_strip.png">
<svg class="over" viewBox="0 0 1242 2688">
 <path d="M1010 1995 C 1050 2070, 1040 2150, 1000 2230" stroke="#FFD200" stroke-width="12" fill="none" stroke-linecap="round"/>
 <path d="M978 2196 L998 2240 L1044 2222" stroke="#FFD200" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<script>
const n=22,pts=[];for(let i=0;i<n*2;i++){const r=i%2?38:50,a=Math.PI*i/n;pts.push(`${50+r*Math.cos(a)}% ${50+r*Math.sin(a)}%`)}
document.getElementById('star').style.clipPath=`polygon(${pts.join(',')})`;
</script>
</body></html>
