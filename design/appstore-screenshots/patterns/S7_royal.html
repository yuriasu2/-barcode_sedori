<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1242px;height:2688px;overflow:hidden}
body{background:#4169E1;background-image:radial-gradient(rgba(255,255,255,.09) 2.2px,transparent 2.8px);background-size:24px 24px;position:relative;font-family:"Hiragino Sans";color:#fff}
.kicker{position:absolute;left:60px;top:150px;font:800 60px "Hiragino Sans";letter-spacing:.04em;background:#111;color:#FFD200;padding:12px 26px 16px}
.lead{position:absolute;left:70px;top:322px;font:800 66px "Hiragino Sans"}
.lead b{border-bottom:10px solid #FFD200}
h1{position:absolute;left:64px;top:430px;font-family:"Toppan Bunkyu Midashi Gothic";font-weight:800;line-height:1.1}
h1 .l1{display:block;font-size:146px}
h1 .l2{display:block;font-size:146px;color:#FFD200}
.burst{position:absolute;right:16px;top:8px;width:310px;height:310px;transform:rotate(12deg)}
.burst div{position:absolute;inset:0;background:#E60012}
.burst span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:"Toppan Bunkyu Midashi Gothic";font-weight:800;font-size:44px;line-height:1.15;text-align:center}
.burst span b{font-size:76px}
.band{position:absolute;left:-40px;right:-40px;top:820px;background:#111;transform:rotate(-3deg);padding:24px 0 28px;text-align:center;font:800 50px "Hiragino Sans"}
.band em{font-style:normal;color:#FFD200}
.phone{position:absolute;left:400px;top:1010px;width:800px;transform:rotate(4deg);filter:drop-shadow(18px 26px 0 rgba(0,20,80,.35))}
.note{position:absolute;font-family:"Klee";font-weight:600;font-size:56px;line-height:1.25;color:#FFD200}
.n1{left:36px;top:1150px;transform:rotate(-7deg)}
.n2{left:36px;top:1880px;transform:rotate(-5deg)}
svg.over{position:absolute;inset:0;width:1242px;height:2688px;pointer-events:none}
</style></head><body>
<div class="kicker">仕入れリストから</div>
<div class="lead"><b>アプリ</b>から<b>Amazon</b>へ</div>
<h1><span class="l1">まとめて</span><span class="l2">一括出品</span></h1>
<div class="burst"><div id="star"></div><span>PCいらずで<b>出品</b></span></div>
<div class="band"><em>CSVファイル</em>への保存にも<em>対応</em>してます。</div>
<img class="phone" src="../phone_listing_real.png">
<div class="note n1">チェック<br>して<br>ポンッ！</div>
<div class="note n2">選んだ<br>商品を<br>まとめて<br>出品！</div>
<svg class="over" viewBox="0 0 1242 2688">
 <path d="M120 1430 C 150 1520, 260 1560, 380 1540" stroke="#FFD200" stroke-width="12" fill="none" stroke-linecap="round"/>
 <path d="M342 1508 L382 1540 L346 1574" stroke="#FFD200" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<script>
const n=22,pts=[];for(let i=0;i<n*2;i++){const r=i%2?38:50,a=Math.PI*i/n;pts.push(`${50+r*Math.cos(a)}% ${50+r*Math.sin(a)}%`)}
document.getElementById('star').style.clipPath=`polygon(${pts.join(',')})`;
</script></body></html>
