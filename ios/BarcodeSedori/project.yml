          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
    settings:
      base:
        # iPhone専用(1)。プロジェクト全体のsettings.baseにも書いているが、そちらだけだと
        # ターゲット側の既定値(1,2 = iPhone+iPad)に上書きされてiPad対応と判定され、
        # 「iPadマルチタスク対応のため4方向すべての向きを指定せよ」というエラーで
        # App Store Connectへのアップロードが弾かれる(90474)。ターゲット側に明示すること。
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: jp.sellira.sellerlens
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "11"
        # Resources/Assets.xcassets の AppIcon を使う
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  BarcodeSedori:
    build:
      targets:
        BarcodeSedori: all
    run:
      config: Debug
      # ローカルStoreKitテスト構成。storeKitConfiguration非対応のXcodeGenならこの行を外す。
      # StoreKit Configuration: None (実機Sandbox / TestFlightを使用)
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
