name: BarcodeSedori
options:
  bundleIdPrefix: jp.sellira
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    # v11系に固定(GADプレフィックスAPI)。最新v12系へ上げる場合はコード側のシンボル名も変更が必要。
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.0.0
  PostHog:
    # 行動ログ計測用。3.x系のAPI(PostHogConfig/PostHogSDK.shared)を前提にコードを書いているため、
    # メジャーアップグレード時はSources/Store/Analytics.swiftのAPI呼び出しも合わせて見直すこと。
    url: https://github.com/PostHog/posthog-ios.git
    from: 3.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: C3GHU74XLL
    CODE_SIGN_STYLE: Automatic

targets:
  BarcodeSedori:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      # Asset Catalog(アプリアイコン)。XcodeGenでは resources ではなく sources に
      # 指定しないとビルドフェーズに入らず、Assets.car が生成されない。
      - path: Assets.xcassets
      # PrivacyInfo.xcprivacy(プライバシーマニフェスト)も同様の問題があり、
      # resources: に Resources フォルダごと指定してもCopy Bundle Resourcesフェーズに
      # 追加されず、アプリバンドル直下に含まれない(XcodeGen 2.45.4で確認)。
      # sources: にファイルを個別指定することで確実にバンドル直下へコピーされる。
      # Resources フォルダごと sources に入れると .gitkeep もバンドルに混入するため、
      # ファイル単位で指定している。
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: GoogleMobileAds
      - package: PostHog
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: セラーレンズ
        # 権限ダイアログ(カメラ・トラッキング許可等)はCFBundleNameを表示するため、
        # 既定のターゲット名(BarcodeSedori)ではなくアプリ名に揃える。
        CFBundleName: セラーレンズ
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "バーコードをスキャンして商品を検索するためにカメラを使用します。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - barcodesedori
            CFBundleURLName: jp.sellira.sellerlens
        # AdMob: 本番のAdMobアプリID。
        GADApplicationIdentifier: "ca-app-pub-2265019305495449~6870745818"
        NSUserTrackingUsageDescription: "あなたに関係のある広告を表示するために使用します。無関係な広告が減り、アプリを無料で使い続けられます。"
        # SKAdNetwork: Google Mobile Ads SDKが要求する全50件(developers.google.com/admob/ios/ios14 記載)。
        # 不足しているとGoogleのSDKが起動時に警告を出し、実際の広告(テスト広告ではなく本番在庫)の
        # 入札に参加できる広告主の範囲が狭まり在庫が減る(fillしにくくなる)。
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
